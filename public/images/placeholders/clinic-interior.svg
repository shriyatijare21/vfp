<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14342B"/>
      <stop offset="100%" stop-color="#102B24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#clinicBg)"/>
  
  <!-- Architectural lines -->
  <line x1="80" y1="360" x2="720" y2="360" stroke="#C6A45C" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="120" y="160" width="240" height="180" rx="8" fill="#173D32" stroke="#C6A45C" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="440" y="160" width="240" height="180" rx="8" fill="#173D32" stroke="#C6A45C" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Center Plaque -->
  <g transform="translate(180, 210)">
