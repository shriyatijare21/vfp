    <text x="220" y="36" text-anchor="middle" fill="#C6A45C" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">CLINIC FACILITY PLACEHOLDER</text>
    <text x="220" y="68" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="20" font-weight="bold">Farande Physiotherapy Clinic</text>
    <text x="220" y="94" text-anchor="middle" fill="#E4D2A5" font-family="system-ui, sans-serif" font-size="13">Sabnis Plot, Near Kali Mata Temple, Maltekdi, Amravati</text>
