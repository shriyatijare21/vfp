<svg width="600" height="750" viewBox="0 0 600 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="doctorCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14342B"/>
      <stop offset="40%" stop-color="#173D32"/>
      <stop offset="100%" stop-color="#102B24"/>
    </linearGradient>
    <radialGradient id="subtleGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#C6A45C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#102B24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4D2A5"/>
      <stop offset="50%" stop-color="#C6A45C"/>
      <stop offset="100%" stop-color="#8E7036"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" rx="20" fill="url(#doctorCardBg)"/>
  <rect width="600" height="750" rx="20" fill="url(#subtleGlow)"/>

  <!-- Restrained Gold Hairline Inset -->
  <rect x="20" y="20" width="560" height="710" rx="14" stroke="url(#goldBorder)" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- Dignified Botanical / Clinical Crest Motif -->
  <g transform="translate(300, 190)">
    <!-- Outer concentric gold rings -->
    <circle cx="0" cy="0" r="110" stroke="#C6A45C" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="95" fill="#113027" stroke="url(#goldBorder)" stroke-width="1.5"/>

    <!-- Subtle Caduceus / Healing Hands Symbolism -->
    <path d="M-30 25 C-30 -25, 0 -55, 0 -70 C0 -55, 30 -25, 30 25 C20 45, -20 45, -30 25 Z" fill="#173D32" stroke="#E4D2A5" stroke-width="2"/>
    <path d="M0 -75 V45" stroke="#C6A45C" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-75" r="7" fill="#E4D2A5"/>
    
    <!-- Anatomical Spinal Nodes in Crest -->
    <ellipse cx="0" cy="-40" rx="12" ry="5" fill="#C6A45C" fill-opacity="0.7"/>
    <ellipse cx="0" cy="-22" rx="14" ry="5.5" fill="#C6A45C" fill-opacity="0.7"/>
    <ellipse cx="0" cy="-4" rx="16" ry="6" fill="#C6A45C" fill-opacity="0.7"/>
    <ellipse cx="0" cy="15" rx="18" ry="6.5" fill="#C6A45C" fill-opacity="0.7"/>

    <!-- Decorative Olive / Laurel sprigs -->
    <path d="M-60 15 C-75 -15, -60 -45, -45 -60" fill="none" stroke="#C6A45C" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M60 15 C75 -15, 60 -45, 45 -60" fill="none" stroke="#C6A45C" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Physician Editorial Typography Block -->
  <g transform="translate(60, 390)">
    <!-- Small Category Pill -->
    <rect x="140" y="0" width="200" height="26" rx="13" fill="#102B24" stroke="#C6A45C" stroke-opacity="0.4" stroke-width="1"/>
    <text x="240" y="17" text-anchor="middle" fill="#E4D2A5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5">CHIEF CONSULTANT</text>

    <!-- Doctor Name -->
    <text x="240" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, Cambria, serif" font-size="26" font-weight="normal">Dr. Vaibhav Ashok Farande</text>
    
    <!-- Degree & Title -->
    <text x="240" y="96" text-anchor="middle" fill="#C6A45C" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">BPT (Bachelor of Physiotherapy)</text>
    
    <!-- Academic Affiliation -->
    <text x="240" y="124" text-anchor="middle" fill="#EFE8DA" fill-opacity="0.85" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">Postgraduate Scholar &bull; School of Health Sciences</text>
    <text x="240" y="145" text-anchor="middle" fill="#EFE8DA" fill-opacity="0.7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400">Garden City University</text>

    <!-- Hairline Separator -->
    <line x1="120" y1="175" x2="360" y2="175" stroke="#C6A45C" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Subtle Clinic Note -->
    <text x="240" y="210" text-anchor="middle" fill="#C6A45C" fill-opacity="0.9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5">Farande Physiotherapy Clinic &bull; Amravati</text>
    <text x="240" y="235" text-anchor="middle" fill="#716F66" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400">Genuine in-clinic photography pending client session</text>
  </g>
</svg>
