<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194337"/>
      <stop offset="100%" stop-color="#102B24"/>
    </linearGradient>
    <radialGradient id="spineAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6A45C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#102B24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" rx="28" fill="url(#heroCardGrad)"/>
  <circle cx="300" cy="300" r="220" fill="url(#spineAura)"/>
  <circle cx="300" cy="300" r="220" stroke="#C6A45C" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="300" cy="300" r="160" stroke="#C6A45C" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Stylized Biomechanical Spine & Movement Vector -->
  <g transform="translate(300, 110)">
    <!-- Cervical Vertices -->
    <ellipse cx="0" cy="30" rx="28" ry="12" fill="#1F5344" stroke="#C6A45C" stroke-width="2"/>
    <ellipse cx="0" cy="65" rx="32" ry="13" fill="#1F5344" stroke="#C6A45C" stroke-width="2"/>
    <ellipse cx="0" cy="100" rx="36" ry="14" fill="#1F5344" stroke="#C6A45C" stroke-width="2"/>
    
    <!-- Thoracic Vertices -->
    <ellipse cx="0" cy="140" rx="40" ry="15" fill="#1F5344" stroke="#C6A45C" stroke-width="2"/>
    <ellipse cx="0" cy="180" rx="44" ry="16" fill="#1F5344" stroke="#C6A45C" stroke-width="2"/>
    <ellipse cx="0" cy="220" rx="48" ry="17" fill="#1F5344" stroke="#C6A45C" stroke-width="2"/>
    <ellipse cx="0" cy="260" rx="52" ry="18" fill="#1F5344" stroke="#C6A45C" stroke-width="2"/>
    
    <!-- Lumbar & Sacrum -->
    <ellipse cx="0" cy="305" rx="58" ry="20" fill="#1F5344" stroke="#E4D2A5" stroke-width="2.5"/>
    <ellipse cx="0" cy="350" rx="64" ry="22" fill="#1F5344" stroke="#E4D2A5" stroke-width="2.5"/>
    <path d="M-40 375 C -20 420, 20 420, 40 375 Z" fill="#C6A45C" fill-opacity="0.6" stroke="#C6A45C" stroke-width="2"/>

    <!-- Central Neural Axis Indicator -->
    <line x1="0" y1="10" x2="0" y2="400" stroke="#E4D2A5" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  </g>

  <!-- Left Float Badge -->
  <g transform="translate(40, 120)">
    <rect width="180" height="60" rx="14" fill="#102B24" fill-opacity="0.95" stroke="#C6A45C" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="20" y="26" fill="#E4D2A5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">EVIDENCE PROTOCOL</text>
    <text x="20" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Dry Needling & Spine</text>
  </g>

  <!-- Right Float Badge -->
  <g transform="translate(380, 420)">
    <rect width="180" height="60" rx="14" fill="#102B24" fill-opacity="0.95" stroke="#C6A45C" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="20" y="26" fill="#25D366" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">● AMRAVATI CLINIC</text>
    <text x="20" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Mon–Sat In Person</text>
  </g>
</svg>

