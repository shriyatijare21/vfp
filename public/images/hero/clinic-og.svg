<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#102B24"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grad)" opacity="0.6"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="1050" cy="180" r="320" stroke="#C6A45C" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="1050" cy="180" r="440" stroke="#C6A45C" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="150" cy="550" r="280" stroke="#C6A45C" stroke-opacity="0.1" stroke-width="1.5"/>

